name: Firmware & Benchmark Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Compile and Run Native Firmware Logic Tests
      run: |
        g++ -std=c++14 -Wall -Wextra tests/native/test_logic.cpp -o test_logic
        ./test_logic

    - name: Run Simulation Benchmark Suite
      run: |
        python3 tests/test_system_benchmarks.py
